trigger:
  name: Trigger alarm
  description: Start the full primary alarm sequence for selected alarm entries.
  fields:
    entry_id:
      required: true
      selector:
        text:
trigger_follow_up:
  name: Trigger follow-up
  description: Start the selected entries' follow-up sequence now.
  fields:
    entry_id:
      required: true
      selector:
        text:
stop:
  name: Stop alarm
  description: Stop the selected entries' active alarm sequence.
  fields:
    entry_id:
      required: true
      selector:
        text:
stop_playback:
  name: Stop current playback
  description: Stop the currently playing alarm phase while allowing later phases to continue.
  fields:
    entry_id:
      required: true
      selector:
        text:
snooze:
  name: Snooze alarm
  description: Silence the active alarm stage and continue it or the next stage after the configured snooze duration.
  fields:
    entry_id:
      required: true
      selector:
        text:
set_media:
  name: Set main media
  description: Set primary or follow-up main media from an Alarm Clock card.
  fields:
    entry_id:
      required: true
      selector:
        text:
    stage:
      required: true
      selector:
        select:
          options:
            - primary_main
            - followup_main
    media:
      selector:
        media:
